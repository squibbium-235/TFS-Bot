services:
  tfsbot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tfsbot

    restart: unless-stopped

    env_file:
      - .env

    # Encrypted SQLite file lives here (APPLICATION_DB_PATH).
    volumes:
      - ./data:/app/data

    # Web UI port (WEBUI_PORT, default 5050). expose
    # makes it reachable by other Compose services;
    # it is not published on the host.
    expose:
      - "5050"

  cloudflared:
    image: cloudflare/cloudflared:latest

    container_name: cloudflared

    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run

    env_file:
      - .env.cloudflare

    depends_on:
      - tfsbot